name: Build

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]

permissions:
 contents: read

jobs:
 build:
  # the extension is TypeScript bundled for VS Code's Node: one system builds and packages it for all. The smoke script
  # (npm run smoke) needs a deployed platform, so it doesn't run here.
  runs-on: ubuntu-latest
  timeout-minutes: 15

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
     with:
      node-version: 22
      cache: npm

   - name: Install
     run: npm ci

   - name: Type check
     run: npm run typecheck

   - name: Build
     run: npm run build

   - name: Test
     run: npm test

   # vsce runs vscode:prepublish first: the type check again, and the production bundle that goes into the package.
   - name: Package
     run: npx vsce package --no-dependencies --out rdcore-vscode.vsix

   - name: Upload the package
     uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
     with:
      name: rdcore-vscode-unsigned
      path: rdcore-vscode.vsix
      if-no-files-found: error
      retention-days: 14
