# RDCore for VS Code: Release
#
# Builds the extension and packages it as a .vsix. A pushed `v*` tag then attaches it to a DRAFT GitHub release, which a
# maintainer checks and publishes by hand.
#   1. prepare (ubuntu-latest): resolves the version, the "version" of package.json plus a suffix taken from the tag
#      (v0.1.0-alpha -> alpha), the pull request (pr.<number>) or the run (ci.<run_number>); on a tag run, checks the tag is
#      on main and the `release` environment restricts what may deploy; writes the release notes.
#   2. package (ubuntu-latest): npm ci, the type check, the build, and vsce package, into rdcore-vscode-<version>.vsix with a
#      SHA256SUMS beside it, both checked.
#   3. publish, tag runs only, under the `release` environment: checks the tag still points at the built commit and has no
#      release (or draft) yet, attests the build provenance of the .vsix, creates a draft release ("RDCore for VS Code
#      <version>"), a prerelease when the tag has a suffix, and uploads the .vsix and SHA256SUMS. The draft stays a draft: a
#      maintainer publishes it.
# A manual run (workflow_dispatch) is a dry run: everything up to the package, uploaded as a short-lived workflow artifact,
# and no release. A pull request that touches the release plumbing runs it too, and uploads nothing.
#
# The .vsix is named after the release's version (rdcore-vscode-0.1.0-alpha.vsix); the extension inside has the version of
# package.json (0.1.0), as VS Code takes a version of three numbers only.
#
# ── One-time setup before this works (a maintainer, before the first tag) ─────────────────────
#   • Settings → Environments: `release`, with a deployment rule of type Tag and the pattern `v*` (a job naming a missing
#     environment creates it unprotected, so the prepare job refuses a tag run unless `release` exists and restricts what may
#     deploy). Required reviewers are recommended: the prepare job warns when there are none.
# ──────────────────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release/**'
      - 'package.json'
      - 'package-lock.json'
      - 'esbuild.mjs'
      - '.vscodeignore'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read is what GitHub documents for reading an environment
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    # event text never goes inside a script: it reaches the scripts through env and is read as $env:...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history, so origin/main is there to check a tag against
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $prefix = "$((Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version)".Trim()
          if ($prefix -notmatch '^\d+\.\d+\.\d+$') {
            Write-Output "::error::The version of package.json must be three numbers, as VS Code takes it (got '$prefix')."
            exit 1
          }
          # SemVer prerelease identifiers: dot-separated, none empty
          $identifiers = '[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          $isTag = $env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag'
          if ($isTag) {
            if ($env:REF_NAME -cnotmatch "^v(?<prefix>\d+\.\d+\.\d+)(-(?<suffix>$identifiers))?$" -or $Matches.prefix -cne $prefix) {
              Write-Output "::error::Tag '$env:REF_NAME' must be v$prefix or v$prefix-<suffix> (the version of package.json is $prefix)."
              exit 1
            }
            $suffix = "$($Matches.suffix)"
          }
          elseif ($env:EVENT_NAME -eq 'pull_request') {
            $suffix = "pr.$env:PR_NUMBER"
          }
          else {
            $suffix = "ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($suffix -and $suffix -cnotmatch "^$identifiers$") {
            Write-Output "::error::'$suffix' is not a valid version suffix."
            exit 1
          }
          $version = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_tag=$($isTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Output "Version $version (tag run: $isTag)"

      - name: Check the tag is on main
        if: steps.version.outputs.is_tag == 'true'
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::$env:GITHUB_SHA is not on main. Tag a commit that is already on main."
            exit 1
          }

      - name: Check the release environment is protected
        if: steps.version.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the publish job names the `release` environment, and a missing environment is created on the spot with no
          # protection at all: refuse to get that far, and fail closed whenever the environment can't be read.
          $response = @(gh api --include "repos/$env:GITHUB_REPOSITORY/environments/release" 2>$null)
          $status = if ($response.Count -and $response[0] -match '^HTTP/\S+\s+(\d{3})') { [int]$Matches[1] } else { 0 }
          $body = ($response | Select-Object -Skip ([array]::IndexOf($response, '') + 1)) -join "`n"
          switch ($status) {
            404 {
              Write-Output "::error::The 'release' environment does not exist. The publish job would create it unprotected; create it, restricted to tags matching v*, first."
              exit 1
            }
            200 {
              $environment = $body | ConvertFrom-Json
              # null: every branch and tag may deploy
              if ($null -eq $environment.deployment_branch_policy) {
                Write-Output "::error::The 'release' environment lets any branch or tag deploy; restrict it to tags matching v*."
                exit 1
              }
              if (-not (@($environment.protection_rules) | Where-Object type -eq 'required_reviewers')) {
                Write-Output "::warning::The 'release' environment has no required reviewers: the draft release is created without an approval."
              }
              Write-Output "The 'release' environment restricts deployment branches and tags."
            }
            default {
              # a transient failure (status 0: no response at all) must not let the run reach an unchecked environment
              Write-Output "::error::Could not read the 'release' environment (HTTP $status). Re-run the job; the environment must exist and restrict what may deploy."
              exit 1
            }
          }
          exit 0

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP notes
          New-Item $notes -ItemType Directory -Force | Out-Null
          $repository = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $text = Get-Content -LiteralPath tools/release/release-notes.template.md -Raw
          $text = $text.Replace('{VERSION}', $env:VERSION).Replace('{SHORT}', $env:GITHUB_SHA.Substring(0, 7)).Replace('{COMMIT}', $env:GITHUB_SHA)
          # {GITREF} is the full ref the attestation records as its source (refs/tags/<tag> on a tag run)
          $text = $text.Replace('{REPOSITORY}', $repository).Replace('{REPO}', $env:GITHUB_REPOSITORY).Replace('{GITREF}', $env:GITHUB_REF)
          $text = $text.Replace('{RUN}', "$repository/actions/runs/$env:GITHUB_RUN_ID")
          if ($text -cmatch '\{[A-Z]+\}') {
            Write-Output "::error::The release notes template has a placeholder this step does not fill: $($Matches[0])."
            exit 1
          }
          [IO.File]::WriteAllText((Join-Path $notes release-notes.md), $text.Replace("`r`n", "`n"), [Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath (Join-Path $notes release-notes.md)

      - name: Upload the release notes
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: ${{ steps.version.outputs.is_tag == 'true' && 30 || 3 }}

  package:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VSIX: rdcore-vscode-${{ needs.prepare.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # vsce runs vscode:prepublish first: the type check again, and the production bundle that goes into the package.
      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          npx vsce package --no-dependencies --out "$RUNNER_TEMP/out/$VSIX"

      # what ships is the .vsix: it is the one file there, it has the bundle, and its manifest has package.json's version
      - name: Check the package
        working-directory: ${{ runner.temp }}/out
        run: |
          found=$(ls)
          [ "$found" = "$VSIX" ] || { echo "::error::Expected $VSIX, found: $found"; exit 1; }
          unzip -l "$VSIX" | grep -q ' extension/dist/extension.js$' || { echo "::error::$VSIX has no extension/dist/extension.js."; exit 1; }
          expected=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          packaged=$(unzip -p "$VSIX" extension/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          [ "$packaged" = "$expected" ] || { echo "::error::$VSIX has version $packaged, package.json has $expected."; exit 1; }
          unzip -l "$VSIX"

      - name: Write and verify the checksums
        working-directory: ${{ runner.temp }}/out
        run: |
          sha256sum "$VSIX" > SHA256SUMS
          sha256sum -c SHA256SUMS

      # a tag run's artifact must outlast an approval of the `release` environment
      - name: Upload the release assets
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.is_tag == 'true' && 30 || 3 }}

  publish:
    needs: [prepare, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pauses here until a required reviewer approves, when the environment has any
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # an approval, or a re-run, keeps the GITHUB_SHA the package job saw: never publish one commit's package under a tag
      # that has since been moved to another. commits/refs/tags/<tag> peels an annotated tag to its commit.
      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha) || {
            echo "::error::Could not resolve $TAG; was it deleted? Nothing is published from this run."
            exit 1
          }
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now points at $sha, but this run built $GITHUB_SHA. Don't re-run it: the run the moved tag started builds and publishes $TAG."
            exit 1
          fi

      # `gh release create --draft` checks for nothing, and GitHub accepts a second draft for the same tag, so a re-run
      # after a failure must stop here. The listing includes drafts because this token can push.
      - name: Check the tag has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end')
          if grep -qx published <<< "$releases"; then
            echo "::error::$TAG is already published; check its assets. There is nothing to re-run."
            exit 1
          elif [ -n "$releases" ]; then
            echo "::error::$(wc -l <<< "$releases") draft release(s) for $TAG already exist, left by an earlier attempt. Delete them but keep the tag: 'gh release delete $TAG -R $GITHUB_REPOSITORY --yes' (without --cleanup-tag) removes one at a time. Then re-run this job."
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes

      - name: Verify the assets
        env:
          VSIX: rdcore-vscode-${{ needs.prepare.outputs.version }}.vsix
        working-directory: assets
        run: |
          sha256sum -c SHA256SUMS
          count=$(find . -maxdepth 1 -type f | wc -l)
          [ "$count" -eq 2 ] && [ -f "$VSIX" ] || { echo "::error::Expected $VSIX and SHA256SUMS; found $(ls | tr '\n' ' ')"; exit 1; }

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*.vsix

      # a draft, which only maintainers see: the assets are all in place, and checked by a person, before anyone else can see
      # the release. A tag with a suffix (v0.1.0-alpha) is a prerelease.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SUFFIX: ${{ needs.prepare.outputs.suffix }}
        run: |
          prerelease=()
          if [ -n "$SUFFIX" ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${prerelease[@]}" --title "RDCore for VS Code $VERSION" --notes-file notes/release-notes.md

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY"
